<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vertical Deep Zoom (Working)</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<canvas id="viewer"></canvas>

<script>
/* ================= CONFIG ================= */

const TILE_WIDTH  = 1440;
const TILE_HEIGHT = 1024;
const IMAGE_HEIGHT = 329400;
const MAX_LEVEL = 9;

/* ================= STATE ================= */

const canvas = document.getElementById("viewer");
const ctx = canvas.getContext("2d");

let zoom = 1;        // scale relative to full resolution
let offsetY = 0;    // image-space Y (full-res pixels)

let dragging = false;
let lastY = 0;

const tileCache = new Map();

/* ================= RESIZE ================= */

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}
window.addEventListener("resize", resize);
resize();

/* ================= LEVEL SELECTION ================= */

function getLevel() {
  const ideal = Math.log2(1 / zoom);
  return Math.max(0, Math.min(MAX_LEVEL, Math.floor(ideal)));
}

/* ================= TILE LOADING ================= */

function loadTile(level, ty) {
  const key = `${level}/${ty}`;
  if (tileCache.has(key)) return tileCache.get(key);

  const img = new Image();
  img.src = `tiles/${level}/${ty}.png`;
  img.onload = render;
  img.onerror = () => tileCache.set(key, null);

  tileCache.set(key, img);
  return img;
}

/* ================= RENDER ================= */

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const level = getLevel();

  // Level tiles are downscaled by 2^level
  const scaleY = zoom * (2 ** level);
  const scaleX = canvas.width / TILE_WIDTH;

  ctx.setTransform(
    scaleX, 0,
    0, scaleY,
    0, -offsetY * scaleY
  );

  const viewTop = offsetY;
  const viewBottom = offsetY + canvas.height / zoom;

  const tileImageHeight = TILE_HEIGHT * (2 ** level);
  const levelImageHeight = IMAGE_HEIGHT / (2 ** level);
  const maxTile = Math.ceil(levelImageHeight / TILE_HEIGHT) - 1;

  const firstTile = Math.max(0, Math.floor(viewTop / tileImageHeight));
  const lastTile  = Math.min(maxTile, Math.ceil(viewBottom / tileImageHeight));

  for (let ty = firstTile; ty <= lastTile; ty++) {
    const img = loadTile(level, ty);
    if (!img || !img.complete || img.naturalWidth === 0) continue;
    ctx.drawImage(img, 0, ty * TILE_HEIGHT);
  }

  drawDebug(level, scaleY, firstTile, lastTile);
}

/* ================= DEBUG HUD ================= */

function drawDebug(level, scaleY, firstTile, lastTile) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(10, 10, 340, 140);

  ctx.fillStyle = "#0f0";
  ctx.font = "12px monospace";

  const lines = [
    `zoom: ${zoom.toExponential(3)}`,
    `level: ${level}`,
    `scaleY: ${scaleY.toExponential(3)}`,
    `offsetY: ${offsetY.toFixed(1)}`,
    `view height: ${(canvas.height / zoom).toFixed(1)}`,
    `tiles: ${firstTile} → ${lastTile}`
  ];

  lines.forEach((l, i) => ctx.fillText(l, 20, 30 + i * 18));
}

/* ================= INPUT ================= */

const MIN_ZOOM = canvas.height / IMAGE_HEIGHT;
const MAX_ZOOM = 1e6;

/* ---- Zoom ---- */

canvas.addEventListener("wheel", e => {
  e.preventDefault();

  const oldLevel = getLevel();
  const oldScaleY = zoom * (2 ** oldLevel);

  const mouseY = e.offsetY;

  // Image-space Y under cursor BEFORE zoom
  const imageY = offsetY + mouseY / oldScaleY;

  // Apply zoom
  const factor = Math.exp(-e.deltaY * 0.001);
  zoom *= factor;
  zoom = Math.max(MIN_ZOOM * 0.99, Math.min(MAX_ZOOM, zoom));

  // Level may have changed → recompute scale
  const newLevel = getLevel();
  const newScaleY = zoom * (2 ** newLevel);

  // Re-anchor imageY under cursor
  offsetY = imageY - mouseY / newScaleY;

  clampOffset();
  render();
}, { passive: false });

/* ---- Pan ---- */

canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastY = e.clientY;
});

window.addEventListener("mousemove", e => {
  if (!dragging) return;

  const dy = e.clientY - lastY;
  lastY = e.clientY;

  const level = getLevel();
  offsetY -= dy / (zoom * (2 ** level));

  clampOffset();
  render();
});

window.addEventListener("mouseup", () => dragging = false);

/* ================= HELPERS ================= */

function clampOffset() {
  const maxOffset = IMAGE_HEIGHT - canvas.height / zoom;
  offsetY = Math.max(0, Math.min(maxOffset, offsetY));
}

/* ================= INIT ================= */

zoom = canvas.height / IMAGE_HEIGHT; // fully zoomed out
offsetY = 0;
render();
</script>

</body>
</html>
