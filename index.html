<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vertical Deep Zoom (Working)</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
#scrollbar {
  position: fixed;
  right: 0;
  top: 0;
  width: 14px;
  height: 100%;
  background: rgba(255,255,255,0.08);
}

#thumb {
  position: absolute;
  left: 2px;
  width: 10px;
  background: rgba(255,255,255,0.6);
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<canvas id="viewer"></canvas>
<div id="scrollbar">
  <div id="thumb"></div>
</div>

<script>
// CONFIG
const TILE_WIDTH  = 1440;
const TILE_HEIGHT = 1024;
const IMAGE_HEIGHT = 18250;
const DAY_HEIGHT = IMAGE_HEIGHT / 365;
const START_DATE = new Date("2025-01-01");
const MAX_LEVEL = 8;

// STATE
const canvas = document.getElementById("viewer");
const ctx = canvas.getContext("2d");

let zoom = 1;        // user zoom factor
let offsetY = 0;     // in LEVEL SPACE (pixels of current pyramid level)

let touchDragging = false;
let lastTouchY = 0;
let pinchLevel = null;
let midYStart = 0;
let imageYStart = 0;
let lastPinchDistance = null;
let dragging = false;
let draggingThumb = false;
let thumbStartY = 0;
let offsetStart = 0;
let lastY = 0;
const tileCache = new Map();

// RESIZE
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}
window.addEventListener("resize", resize);
resize();

/* ============= SCROLLBAR =========== */
thumb.addEventListener("mousedown", e => {
  draggingThumb = true;
  thumbStartY = e.clientY;
  offsetStart = offsetY;
  e.preventDefault();
});

window.addEventListener("mousemove", e => {
  if (!draggingThumb) return;

  const level = getLevel();
  const scaleY = zoom * (2 ** level);
  const visible = canvas.height / scaleY;
  const levelHeight = IMAGE_HEIGHT / (2 ** level);
  const maxOffset = levelHeight - visible;
  if (maxOffset <= 0) return;

  const thumbHeight = thumb.clientHeight;
  const maxThumbY = scrollbar.clientHeight - thumbHeight;

  const dy = e.clientY - thumbStartY;
  const delta = dy / maxThumbY;

  offsetY = offsetStart + delta * maxOffset;
  clampOffset();
  render();
});

window.addEventListener("mouseup", () => draggingThumb = false);

// Touch
function getDistance(touches) {
  const dy = touches[0].clientY - touches[1].clientY;
  const dx = touches[0].clientX - touches[1].clientX;
  return Math.hypot(dx, dy);
}

// SINGLE-FINGER PAN START
canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    touchDragging = true;
    lastTouchY = e.touches[0].clientY;
    e.preventDefault();
  }
  // PINCH START
  else if (e.touches.length === 2) {
    pinchLevel = getLevel(); // lock level during pinch
    lastPinchDistance = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    midYStart = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const scaleY = zoom * (2 ** pinchLevel);
    imageYStart = (offsetY + midYStart / scaleY) * (2 ** pinchLevel);
    e.preventDefault();
  }
}, { passive:false });

// SINGLE-FINGER PAN / PINCH MOVE
canvas.addEventListener("touchmove", e => {

  // ONE-FINGER PAN
  if (e.touches.length === 1 && touchDragging) {
    const level = getLevel();
    const scaleY = zoom * (2 ** level);

    const dy = e.touches[0].clientY - lastTouchY;
    lastTouchY = e.touches[0].clientY;

    offsetY -= dy / scaleY; // LEVEL SPACE
    clampOffset();
    render();
    e.preventDefault();
  }

  // TWO-FINGER PINCH
  else if (e.touches.length === 2 && lastPinchDistance !== null && pinchLevel !== null) {
    const newDistance = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const factor = newDistance / lastPinchDistance;
    lastPinchDistance = newDistance;

    // Update zoom
    zoom *= factor;
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

    const newScaleY = zoom * (2 ** pinchLevel);
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

    // Keep the same image row under pinch midpoint
    offsetY = imageYStart / (2 ** pinchLevel) - midY / newScaleY;

    clampOffset();
    render();
    e.preventDefault();
  }

});

// TOUCH END
canvas.addEventListener("touchend", e => {
  if (e.touches.length === 0) touchDragging = false;
  if (e.touches.length < 2) {
    lastPinchDistance = null;
    pinchLevel = null;
  }
});


function updateScrollbar() {
  const level = getLevel();
  const scaleY = zoom * (2 ** level);

  const visible = canvas.height / scaleY;
  const levelHeight = IMAGE_HEIGHT / (2 ** level);
  const maxOffset = levelHeight - visible;

  // Thumb size proportional to visible fraction
  const thumbHeight = Math.max(20, (visible / levelHeight) * scrollbar.clientHeight);
  thumb.style.height = thumbHeight + "px";

  // Thumb position
  const t = maxOffset > 0 ? offsetY / maxOffset : 0;
  const maxThumbY = scrollbar.clientHeight - thumbHeight;
  thumb.style.top = (t * maxThumbY) + "px";
}

// LEVEL SELECTION
function getLevel() {
  return Math.max(0, Math.min(MAX_LEVEL, Math.floor(Math.log2(1 / zoom))));
}

function formatDate(d) {
  return d.toISOString().slice(0, 10); // YYYY-MM-DD
}

function drawDayLabels(level, scaleY) {
  //if (level <= 4) return;

  ctx.save();

  // Reset transform so text is screen-space
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  ctx.font = "14px sans-serif";
  ctx.fillStyle = "white";
  ctx.textBaseline = "top";
  ctx.shadowColor = "black";
  ctx.shadowBlur = 4;

  const visibleTop = offsetY;
  const visibleBottom = offsetY + canvas.height / scaleY;

  const firstDay = Math.floor(visibleTop / DAY_HEIGHT);
  const lastDay = Math.floor(visibleBottom / DAY_HEIGHT);

  for (let day = firstDay; day <= lastDay; day++) {
    if (day < 0 || day >= 365) continue;

    const dayTopImage = day * DAY_HEIGHT;
    const yScreen =
      (dayTopImage - offsetY) * scaleY;

    if (yScreen < -20 || yScreen > canvas.height) continue;

    const date = new Date(START_DATE);
    date.setDate(date.getDate() + day);

    ctx.fillText(
      formatDate(date),
      8,                // left margin
      yScreen + 8       // top-left of the day
    );
  }

  ctx.restore();
}


// TILE LOADING
function loadTile(level, ty) {
  const key = `${level}/${ty}`;
  if (tileCache.has(key)) return tileCache.get(key);

  const img = new Image();
  img.src = `tiles/${level}/${ty}.jpg`;
  img.onload = render;
  img.onerror = () => tileCache.set(key, null);

  tileCache.set(key, img);
  return img;
}

// RENDER
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const level = getLevel();
  const scaleY = zoom * (2 ** level);
  const scaleX = canvas.width / TILE_WIDTH;

  ctx.setTransform(scaleX,0,0,scaleY,0,-offsetY*scaleY);

  const levelHeight = IMAGE_HEIGHT / (2 ** level);
  const visible = canvas.height / scaleY;
  const maxTile = Math.ceil(levelHeight / TILE_HEIGHT) - 1;

  const firstTile = Math.max(0, Math.floor(offsetY / TILE_HEIGHT));
  const lastTile = Math.min(maxTile, Math.ceil((offsetY + visible) / TILE_HEIGHT));

  for (let ty = firstTile; ty <= lastTile; ty++) {
    const img = loadTile(level, ty);
    if (!img || !img.complete || img.naturalWidth===0) continue;
    ctx.drawImage(img, 0, ty * TILE_HEIGHT);
  }

  // Optional debug HUD
/*
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(10,10,340,140);
  ctx.fillStyle = "#0f0";
  ctx.font = "12px monospace";
  const lines = [
    `zoom: ${zoom.toExponential(3)}`,
    `level: ${level}`,
    `scaleY: ${scaleY.toExponential(3)}`,
    `offsetY: ${offsetY.toFixed(1)}`,
    `view height: ${visible.toFixed(1)}`,
    `tiles: ${firstTile} → ${lastTile}`
  ];
  lines.forEach((l,i)=>ctx.fillText(l,20,30+i*18));
*/
  updateScrollbar();
  drawDayLabels(level, scaleY);
}

// CLAMP
function clampOffset() {
  const level = getLevel();
  const scaleY = zoom * (2 ** level);
  const visible = canvas.height / scaleY;
  const levelHeight = IMAGE_HEIGHT / (2 ** level);
  const maxOffset = levelHeight - visible;
  offsetY = Math.max(0, Math.min(maxOffset, offsetY));
}

// ZOOM
const MIN_ZOOM = canvas.height / IMAGE_HEIGHT;
const MAX_ZOOM = canvas.height / (2 ** MAX_LEVEL);

canvas.addEventListener("wheel", e => {
  e.preventDefault();

  const oldLevel = getLevel();
  const oldScaleY = zoom * (2 ** oldLevel);
  const mouseY = e.offsetY;

  // image row in FULL image coordinates (level-space normalized to base)
  const imageY = (offsetY + mouseY / oldScaleY) * (2 ** oldLevel);

  // update zoom
  const factor = Math.exp(-e.deltaY * 0.001);
  zoom *= factor;
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

  const newLevel = getLevel();
  const newScaleY = zoom * (2 ** newLevel);

  // convert back to new level-space offsetY
  offsetY = imageY / (2 ** newLevel) - mouseY / newScaleY;

  clampOffset();
  render();
}, { passive:false });


// PAN
canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastY = e.clientY;
});

window.addEventListener("mousemove", e=>{
  if(!dragging) return;

  const level = getLevel();
  const scaleY = zoom * (2 ** level);
  const dy = e.clientY - lastY;
  lastY = e.clientY;

  offsetY -= dy / scaleY;
  clampOffset();
  render();
});

window.addEventListener("mouseup", ()=>dragging=false);

// INIT
zoom = canvas.height / IMAGE_HEIGHT; // fully zoomed out
offsetY = 0;
render();
</script>


</body>
</html>
